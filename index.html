<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>電卓</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="電卓">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Hiragino Sans", sans-serif;
  }
  /* 390x844 の基準デザインを、機種の画面サイズに合わせて等倍スケール */
  .calc {
    width: 390px;
    height: 844px;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    background: #000;
    display: flex;
    flex-direction: column;
    padding: 12px 14px 22px;
    user-select: none;
  }
  /* ---- 上部バー ---- */
  .topbar {
    display: flex;
    justify-content: flex-start;
    padding: 4px 6px;
  }
  .topbar .menu {
    color: #ff9f0a;
    font-size: 22px;
    line-height: 1;
    cursor: default;
    padding: 4px 10px;
    transition: opacity 0.15s;
  }
  .spacer { flex: 1 1 auto; }
  /* ---- 入力中の式（iOS18風・メイン表示の上）フリックで横スクロール可 ---- */
  .expr {
    overflow-x: auto;
    overflow-y: hidden;
    min-height: 42px;
    line-height: 42px;
    padding: 0 8px;
    color: #98989d;
    font-size: 30px;
    font-weight: 400;
    white-space: nowrap;
    letter-spacing: 0.5px;
    text-align: right;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .expr::-webkit-scrollbar { display: none; }
  .expr-inner { display: inline-block; }
  /* ---- メイン表示（ライブ結果） ---- */
  .display {
    color: #fff;
    text-align: right;
    font-size: 82px;
    font-weight: 300;
    padding: 0 6px 6px;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.15;
    min-height: 100px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }
  .rad {
    color: #d1d1d6;
    font-size: 15px;
    padding: 0 8px 8px;
    height: 28px;
    transition: color 0.2s;
  }
  .rad.on { color: #ff9f0a; }
  /* ---- キーパッド ---- */
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .key {
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    font-size: 32px;
    font-weight: 400;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.15s;
    font-family: inherit;
  }
  .key:active { filter: brightness(1.6); }
  .key.num { background: #333333; color: #fff; }
  .key.fn  { background: #a5a5a5; color: #000; font-size: 28px; }
  .key.op  { background: #ff9f0a; color: #fff; font-size: 38px; font-weight: 500; }
  .key.op.active { background: #fff; color: #ff9f0a; }
  .key.icon svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="calc">
    <div class="topbar"><span class="menu" id="menuBtn">&#x2630;</span></div>
    <div class="spacer"></div>
    <div class="expr" id="exprWrap"><span class="expr-inner" id="expr"></span></div>
    <div class="display" id="display">0</div>
    <div class="rad" id="radLabel">Rad</div>
    <div class="keys">
      <button class="key fn"  data-key="ac"  id="acBtn">AC</button>
      <button class="key fn"  data-key="pm">⁺⁄₋</button>
      <button class="key fn"  data-key="pct">%</button>
      <button class="key op"  data-key="÷">÷</button>
      <button class="key num" data-key="7">7</button>
      <button class="key num" data-key="8">8</button>
      <button class="key num" data-key="9">9</button>
      <button class="key op"  data-key="×">×</button>
      <button class="key num" data-key="4">4</button>
      <button class="key num" data-key="5">5</button>
      <button class="key num" data-key="6">6</button>
      <button class="key op"  data-key="−">−</button>
      <button class="key num" data-key="1">1</button>
      <button class="key num" data-key="2">2</button>
      <button class="key num" data-key="3">3</button>
      <button class="key op"  data-key="+">+</button>
      <button class="key num icon" data-key="none" id="calcIcon" aria-label="電卓切替">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
          <rect x="5.5" y="3" width="13" height="18" rx="3"/>
          <line x1="8.5" y1="7" x2="15.5" y2="7"/>
          <circle cx="9" cy="11.5" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="12" cy="11.5" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="15" cy="11.5" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="9" cy="15" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="12" cy="15" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="15" cy="15" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="9" cy="18.2" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="12" cy="18.2" r="0.9" fill="#fff" stroke="none"/>
          <circle cx="15" cy="18.2" r="0.9" fill="#fff" stroke="none"/>
        </svg>
      </button>
      <button class="key num" data-key="0">0</button>
      <button class="key num" data-key=".">.</button>
      <button class="key op"  data-key="=">=</button>
    </div>
  </div>

<script>
(function(){
  'use strict';

  // ===== 状態 =====
  let acc = null;        // 累積結果
  let op = null;         // 保留中の演算子
  let cur = '0';         // 入力中の数値（文字列）
  let typing = false;    // 数値入力中か
  let committed = 0;     // 確定した数値の個数
  let parts = [];        // 入力中の式パーツ（数値と演算子）
  let justEval = false;  // 直前に = を押したか
  let lastExpr = '';     // = 直後に上段へ残す式
  let forced = null;     // マジック用 { digits, idx }

  // 調整入力のタイミング（何個目の入力を強制調整にするか）。既定5・範囲3〜20
  // 設定方法: 計算前に回数の数字を入力して左上の☰をタップ
  let magicEntry = 5;
  try {
    const saved = parseInt(localStorage.getItem('calc_cfg'), 10);
    if (saved >= 3 && saved <= 20) magicEntry = saved;
  } catch (e) {}

  // 時刻補正（分、-5〜+5）。計算前に「＋1」等を入力して左下の電卓マークをタップで設定。
  // 演技中の時間ズレ対策。アプリ再起動でリセット（0に戻る）
  let timeOffsetMin = 0;

  // 和暦モード。電卓マーク長押しで切替（Radがオレンジ＝ON）。localStorageに保存
  let eraWareki = false;
  try { eraWareki = localStorage.getItem('calc_era') === '1'; } catch (e) {}
  const displayEl = document.getElementById('display');
  const exprEl = document.getElementById('expr');
  const exprWrap = document.getElementById('exprWrap');
  const acBtn = document.getElementById('acBtn');

  // ===== ターゲット：今日の日付＋今の時間 =====
  // 西暦: YYMMDDHHmm（例 2607091755）／ 和暦: 令和年+MMDDHHmm（例 807091755）
  // timeOffsetMin 分だけずらす（分・時・日・月をまたぐ繰り上がりも Date が自動処理）
  function nowTarget(){
    const d = new Date(Date.now() + timeOffsetMin * 60000);
    const p = n => String(n).padStart(2, '0');
    const yearPart = eraWareki ? String(d.getFullYear() - 2018) : p(d.getFullYear() % 100);
    return Number(
      yearPart + p(d.getMonth() + 1) + p(d.getDate()) +
      p(d.getHours()) + p(d.getMinutes())
    );
  }

  // ===== 表示整形 =====
  function fmt(s){
    if (s === '' || s == null) return '0';
    let str = String(s);
    const neg = str.startsWith('-');
    if (neg) str = str.slice(1);
    const dot = str.split('.');
    dot[0] = dot[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + dot.join('.');
  }

  function numStr(x){
    let n = typeof x === 'number' ? x : parseFloat(x);
    if (!isFinite(n)) return 'エラー';
    n = Math.round(n * 1e8) / 1e8;
    let s = String(n);
    if (s.includes('e')) s = n.toFixed(0);
    return s;
  }

  function isOp(s){ return s === '+' || s === '−' || s === '×' || s === '÷'; }

  function applyOp(a, o, b){
    switch (o) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  // ===== 描画 =====
  function exprString(){
    let e = parts.map(p => isOp(p) ? p : fmt(p)).join('');
    if (typing) e += fmt(cur);
    return e;
  }

  let lastExprShown = '';
  function update(){
    // 上段：入力中の式（= 直後は確定した式を残す）
    if (justEval) exprEl.textContent = lastExpr;
    else if (parts.length) exprEl.textContent = exprString();
    else exprEl.textContent = '';
    // 式が変わったら右端（最新の入力）まで自動スクロール。フリックで戻って確認できる
    if (exprEl.textContent !== lastExprShown) {
      lastExprShown = exprEl.textContent;
      exprWrap.scrollLeft = exprWrap.scrollWidth;
    }

    // メイン：入力中の数字をそのまま表示（計算結果は = を押したときだけ）
    const main = fmt(cur);
    displayEl.textContent = main;
    const len = main.length;
    displayEl.style.fontSize = (len <= 7 ? 82 : Math.max(34, Math.floor(82 * 7 / len))) + 'px';

    acBtn.textContent = (typing && cur !== '0') ? '⌫' : 'AC';
    document.querySelectorAll('.key.op').forEach(b => {
      b.classList.toggle('active', !typing && op === b.dataset.key);
    });
  }

  // ===== マジック発動 =====
  function activateMagic(){
    const target = nowTarget();
    let useOp = '+';
    let need = target - acc;
    if (op === '−' && acc - target > 0) { useOp = '−'; need = acc - target; }
    if (need < 0) { useOp = '−'; need = acc - target; }
    op = useOp;
    if (parts.length && isOp(parts[parts.length - 1])) parts[parts.length - 1] = useOp;
    forced = { digits: String(Math.round(need)), idx: 0 };
  }

  // ===== キー処理 =====
  function pressDigit(d){
    if (justEval) { justEval = false; lastExpr = ''; cur = '0'; typing = false; parts = []; committed = 0; acc = null; op = null; }
    if (forced && op !== null) {
      if (forced.idx >= forced.digits.length) return; // 打ち切り：それ以上は入力されない
      d = forced.digits[forced.idx++];
    }
    if (!typing) {
      cur = (d === '.') ? '0.' : d;
      typing = true;
    } else {
      if (d === '.' && cur.includes('.')) return;
      if (!forced && cur.replace(/[-.]/g, '').length >= 9) return; // 通常時は9桁まで
      cur += d;
    }
    update();
  }

  function pressOp(o){
    if (justEval) {
      justEval = false;
      lastExpr = '';
      acc = parseFloat(cur);
      parts = [numStr(cur)];
      committed = 1;
    } else if (typing) {
      const v = parseFloat(cur);
      acc = (acc === null || op === null) ? v : applyOp(acc, op, v);
      parts.push(numStr(v));
      committed++;
      typing = false;
      forced = forced && forced.idx > 0 ? null : forced;
    } else if (acc === null) {
      acc = parseFloat(cur);
      parts = [numStr(cur)];
      committed = 1;
    }
    op = o;
    if (parts.length && isOp(parts[parts.length - 1])) parts[parts.length - 1] = o;
    else parts.push(o);
    if (committed >= magicEntry - 1 && !forced) activateMagic();
    update();
  }

  function pressEquals(){
    if (op === null || acc === null || !typing) { update(); return; }
    // マジック中に桁が残っていたら自動補完して必ずターゲットに合わせる
    if (forced && forced.idx < forced.digits.length) {
      cur = (forced.idx === 0 ? '' : cur) + forced.digits.slice(forced.idx);
      forced.idx = forced.digits.length;
    }
    const v = parseFloat(cur);
    const res = applyOp(acc, op, v);
    parts.push(numStr(v));
    lastExpr = parts.map(p => isOp(p) ? p : fmt(p)).join('') + '=';
    cur = numStr(res);
    acc = null; op = null; typing = false; committed = 0; forced = null; parts = [];
    justEval = true;
    update();
  }

  function pressAC(){
    if (typing && cur !== '0') { // ⌫（1文字削除）
      cur = cur.slice(0, -1);
      if (forced && forced.idx > 0) forced.idx--;
      if (cur === '' || cur === '-') { cur = '0'; typing = false; }
    } else { // AC（全リセット）
      acc = null; op = null; cur = '0'; typing = false;
      committed = 0; forced = null; parts = []; justEval = false; lastExpr = '';
    }
    update();
  }

  function press(key){
    if (key >= '0' && key <= '9' || key === '.') pressDigit(key);
    else if (isOp(key)) pressOp(key);
    else if (key === '=') pressEquals();
    else if (key === 'ac') pressAC();
    else if (key === 'pm') {
      if (cur !== '0') { cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur; update(); }
    }
    else if (key === 'pct') {
      cur = numStr(parseFloat(cur) / 100); typing = true; update();
    }
  }

  document.querySelectorAll('.key').forEach(b => {
    if (b.dataset.key === 'none') return;
    b.addEventListener('click', () => press(b.dataset.key));
  });

  // ☰: タップ=調整入力タイミングの設定（計算前に 3〜20 の数字を入力してタップ）
  //     長押し(600ms)=センサー診断モードの表示/非表示
  const menuBtn = document.getElementById('menuBtn');
  let menuTimer = null;
  let menuLongFired = false;
  menuBtn.addEventListener('pointerdown', () => {
    menuLongFired = false;
    clearTimeout(menuTimer);
    menuTimer = setTimeout(() => { menuLongFired = true; toggleDebug(); }, 600);
  });
  menuBtn.addEventListener('pointerup', () => clearTimeout(menuTimer));
  menuBtn.addEventListener('pointerleave', () => clearTimeout(menuTimer));
  menuBtn.addEventListener('contextmenu', e => e.preventDefault());
  menuBtn.addEventListener('click', () => {
    if (menuLongFired) { menuLongFired = false; return; }
    // 計算開始前（最初の数値を入力中）のみ受け付ける
    if (!typing || parts.length || justEval || forced || cur.includes('.') || cur.includes('-')) return;
    const n = parseInt(cur, 10);
    if (!(n >= 3 && n <= 20)) return;
    magicEntry = n;
    try { localStorage.setItem('calc_cfg', String(n)); } catch (e) {}
    // 全リセットして表示を0に戻す（☰がかすかに点滅＝設定完了の合図）
    acc = null; op = null; cur = '0'; typing = false;
    committed = 0; forced = null; parts = []; justEval = false; lastExpr = '';
    menuBtn.style.opacity = '0.25';
    setTimeout(() => { menuBtn.style.opacity = '1'; }, 200);
    update();
  });

  // キーボード対応
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k >= '0' && k <= '9') press(k);
    else if (k === '.') press('.');
    else if (k === '+') press('+');
    else if (k === '-') press('−');
    else if (k === '*') press('×');
    else if (k === '/') { e.preventDefault(); press('÷'); }
    else if (k === 'Enter' || k === '=') press('=');
    else if (k === 'Backspace') press('ac');
    else if (k === 'Escape') { typing = false; cur = '0'; press('ac'); }
  });

  // ===== 左下の電卓マーク =====
  // タップ: 時刻補正の設定（計算前に「＋1」〜「＋5」/「−1」〜「−5」を入力してタップ。±0でリセット）
  // 長押し(600ms): 和暦モード切替（Radがオレンジ＝和暦ON）
  const calcIcon = document.getElementById('calcIcon');
  const radLabel = document.getElementById('radLabel');

  function refreshRad(){ radLabel.classList.toggle('on', eraWareki); }
  refreshRad();

  function fullReset(){
    acc = null; op = null; cur = '0'; typing = false;
    committed = 0; forced = null; parts = []; justEval = false; lastExpr = '';
  }

  function blink(el){
    el.style.opacity = '0.25';
    setTimeout(() => { el.style.opacity = '1'; }, 200);
  }

  function trySetOffset(){
    // 計算前に「＋n」「−n」だけが入力された状態のみ受け付ける（acc=0 は最初の暗黙の0）
    if (!typing || justEval || forced || cur.includes('.')) return;
    if (committed !== 1 || acc !== 0 || (op !== '+' && op !== '−')) return;
    const n = parseInt(cur, 10);
    if (!(n >= 0 && n <= 5)) return;
    timeOffsetMin = (op === '+') ? n : -n;
    fullReset();
    blink(calcIcon);
    update();
  }

  function toggleEra(){
    eraWareki = !eraWareki;
    try { localStorage.setItem('calc_era', eraWareki ? '1' : '0'); } catch (e) {}
    refreshRad();
  }

  let longTimer = null;
  let longFired = false;
  calcIcon.addEventListener('pointerdown', () => {
    longFired = false;
    clearTimeout(longTimer);
    longTimer = setTimeout(() => { longFired = true; toggleEra(); }, 600);
  });
  calcIcon.addEventListener('pointerup', () => {
    clearTimeout(longTimer);
    if (!longFired) trySetOffset();
  });
  calcIcon.addEventListener('pointerleave', () => clearTimeout(longTimer));
  calcIcon.addEventListener('contextmenu', e => e.preventDefault());

  // テスト用に公開
  window.__toggleEra = toggleEra;
  window.__trySetOffset = trySetOffset;
  window.__getState = () => JSON.stringify({ timeOffsetMin, eraWareki, magicEntry });

  // ===== 逆さま検出: 666,666 ⇔ 999,999 =====
  // 加速度センサーの重力方向で判定。y < -6 ＝ 本体が逆さま、y > 6 ＝ 通常の向き。
  // 666,666 か 999,999 を表示した状態で逆さまにすると「腕」が上がり、
  // 元の向きに戻した瞬間に 6 と 9 が入れ替わる
  const FLIP_PAIRS = {
    '666666': '999999',       '999999': '666666',
    '666666666': '999999999', '999999999': '666666666'
  };
  // 機種の基準向き（スマホ=縦基準/タブレット=横基準）に依存しないよう、
  // 画面平面内の重力ベクトルの向きが「約180度反転 → 元に戻る」ことで判定する
  let flipState = null; // { base: 基準角度, armed: 逆さま済みか }
  function motionVec(x, y){
    if (!Object.prototype.hasOwnProperty.call(FLIP_PAIRS, cur)) { flipState = null; return; }
    if (Math.hypot(x, y) < 4) return; // ほぼ水平持ちは判定不能（立て気味に持つ）
    const ang = Math.atan2(y, x);
    if (!flipState) { flipState = { base: ang, armed: false }; return; }
    let diff = Math.abs(ang - flipState.base);
    if (diff > Math.PI) diff = 2 * Math.PI - diff;
    if (diff > Math.PI * 0.75) {            // 135度以上回った＝逆さま
      flipState.armed = true;
    } else if (diff < Math.PI * 0.25) {     // 45度以内＝通常の向き
      if (flipState.armed) {
        flipState = null;
        const swapped = FLIP_PAIRS[cur];
        if (swapped) { cur = swapped; update(); }
      } else {
        flipState.base = ang;               // 通常の向きの間は基準を追従させる
      }
    }
  }
  // 加速度センサー（メイン）。有効なデータが来ている間は傾きセンサーは使わない
  let motionSeen = false;
  let lastM = 'なし', lastO = 'なし';
  window.addEventListener('devicemotion', e => {
    const g = e.accelerationIncludingGravity;
    if (!g || typeof g.y !== 'number') return;
    const x = g.x || 0, y = g.y, z = g.z || 0;
    lastM = x.toFixed(1) + ', ' + y.toFixed(1) + ', ' + z.toFixed(1);
    if (Math.hypot(x, y, z) > 2) motionSeen = true;
    motionVec(x, y);
    dbgUpdate();
  });
  // 傾きセンサー（予備）: 加速度センサーが無い/動かない機種向け。
  // beta/gamma から画面平面内の重力成分を復元して同じ判定に流す
  window.addEventListener('deviceorientation', e => {
    if (e.beta == null || e.gamma == null) return;
    const b = e.beta * Math.PI / 180, c = e.gamma * Math.PI / 180;
    const ax = -9.8 * Math.cos(b) * Math.sin(c);
    const ay = 9.8 * Math.sin(b);
    lastO = e.beta.toFixed(0) + '°, ' + e.gamma.toFixed(0) + '° → ' + ax.toFixed(1) + ', ' + ay.toFixed(1);
    if (!motionSeen) motionVec(ax, ay);
    dbgUpdate();
  });
  window.__motion = motionVec; // テスト用 (x, y)

  // ===== iOS(Safari)のセンサー許可 =====
  // iOS13以降は「モーションと画面の向きへのアクセス」をユーザー操作から明示的に
  // リクエストしないと devicemotion/deviceorientation が一切発火しない。
  // 画面のどこか最初の1タップ（=普段どおりキーを押すだけ）でリクエストする。
  let motionPermState = '不要（このOSでは常に有効）';
  function needsIOSPermission(){
    return (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function');
  }
  if (needsIOSPermission()) motionPermState = '未許可（画面をタップすると許可を求められます）';
  function requestMotionPermissionOnce(){
    const reqs = [];
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      reqs.push(DeviceMotionEvent.requestPermission().then(r => ({ kind: 'motion', r })));
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      reqs.push(DeviceOrientationEvent.requestPermission().then(r => ({ kind: 'orientation', r })));
    }
    if (!reqs.length) return;
    Promise.all(reqs).then(results => {
      const denied = results.some(x => x.r !== 'granted');
      motionPermState = denied ? '拒否されました（設定アプリ→Safari→モーションと向きで許可可能）' : '許可されました';
      dbgUpdate();
    }).catch(() => {
      motionPermState = 'リクエスト失敗';
      dbgUpdate();
    });
  }
  if (needsIOSPermission()) {
    document.addEventListener('pointerdown', requestMotionPermissionOnce, { once: true });
  }
  window.__requestMotionPermission = requestMotionPermissionOnce; // テスト用

  // ネイティブ側(Android)から注入される加速度値。
  // WebViewにセンサーイベントが届かない機種でも、こちらの経路で必ず動く
  window.__nativeMotion = function(x, y, z){
    lastM = x.toFixed(1) + ', ' + y.toFixed(1) + ', ' + z.toFixed(1) + ' (native)';
    if (Math.hypot(x, y, z) > 2) motionSeen = true;
    motionVec(x, y);
    dbgUpdate();
  };

  // ===== センサー診断モード（☰長押しで表示/非表示） =====
  let dbgEl = null, dbgOn = false;
  function toggleDebug(){
    dbgOn = !dbgOn;
    if (!dbgEl) {
      dbgEl = document.createElement('div');
      dbgEl.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;color:#0f0;' +
        'font:14px/1.5 monospace;background:rgba(0,0,0,0.7);padding:8px 10px;' +
        'border-radius:8px;pointer-events:none;white-space:pre';
      document.body.appendChild(dbgEl);
    }
    dbgEl.style.display = dbgOn ? 'block' : 'none';
    dbgUpdate();
  }
  function dbgUpdate(){
    if (!dbgOn || !dbgEl) return;
    let st = '対象外の数字';
    if (Object.prototype.hasOwnProperty.call(FLIP_PAIRS, cur)) {
      st = flipState ? (flipState.armed ? '逆さま検出済み！戻せば発動' : '監視中(基準セット済)') : '監視待ち';
    }
    dbgEl.textContent =
      'iOS許可: ' + motionPermState + '\n' +
      '加速度: ' + lastM + (motionSeen ? ' ✓' : '') + '\n' +
      '傾き:   ' + lastO + '\n' +
      '判定:   ' + st;
  }

  // ===== スリープ防止 =====
  // Wake Lock API（対応ブラウザ用）。APK側でもネイティブの画面常時ONフラグを設定している
  async function keepAwake(){
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

  // 式エリア: タッチはネイティブのフリックスクロール、PCはマウスドラッグでスクロール
  let dragX = null;
  exprWrap.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    dragX = e.clientX;
    exprWrap.setPointerCapture(e.pointerId);
  });
  exprWrap.addEventListener('pointermove', e => {
    if (dragX === null) return;
    exprWrap.scrollLeft += dragX - e.clientX;
    dragX = e.clientX;
  });
  exprWrap.addEventListener('pointerup', () => { dragX = null; });
  exprWrap.addEventListener('pointercancel', () => { dragX = null; });

  // 画面サイズに合わせて電卓全体をスケール（タブレット等でも画面いっぱいに表示）
  const calcEl = document.querySelector('.calc');
  function fitScale(){
    const s = Math.min(window.innerWidth / 390, window.innerHeight / 844);
    calcEl.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fitScale);
  window.addEventListener('orientationchange', fitScale);
  window.addEventListener('load', fitScale);
  fitScale();
  // WebView起動直後はサイズ確定が遅れることがあるため念のため再計算
  setTimeout(fitScale, 300);
  setTimeout(fitScale, 1000);

  // テスト用に公開
  window.__press = press;
  window.__nowTarget = nowTarget;

  update();
})();
</script>
</body>
</html>
